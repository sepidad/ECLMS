[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eclms"
version = "0.1.0"
description = "Enterprise Contract Lifecycle Management System - Modular Monolith"
readme = "backend/README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "bcrypt>=4.1",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "simpleeval>=1.0",
  "apscheduler>=3.10",
  "redis>=5.0",
  "httpx>=0.27",
  "boto3>=1.34",
  "python-docx>=1.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
include = ["backend*", "shared*", "infrastructure*"]

[tool.pytest.ini_options]
testpaths = ["backend", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
